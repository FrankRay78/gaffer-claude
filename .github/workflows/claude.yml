name: Claude Code

# Answers an `@claude` mention in a conversation comment on an issue or a pull request, on the same
# thread. Only FrankRay78's comments are answered: the repository is public, and a run spends the
# maintainer's Claude subscription. An inline review comment or a review body is not a trigger —
# `issue_comment` carries only conversation comments, on issues and pull requests alike.
#
# It can commit and push to the branch it is working on, when asked to. The action exchanges OIDC
# for the Claude app's token (hence `id-token: write`), which pushes under the app's own
# installation permissions, as NetPace's copy of this workflow does; `contents: read` is this
# run's token's only. It is not handed `github_token`: a push under that token starts no workflow,
# so `shell-tests` and `link-check` would never run on the commit it pushes.
# `main` takes no direct push (its ruleset requires a pull request and has no bypass actors), and
# the app cannot change files under `.github/workflows/`.

on:
  issue_comment:
    types: [created]

jobs:
  respond:
    if: >-
      github.event.comment.user.login == 'FrankRay78' &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The action starts the agent in auto mode, where a safety review decides each command no
      # rule covers. That is kept, so the agent can run what the maintainer would — the tests, the
      # scripts, `gh` — but the review is a judgement, not a boundary. The deny rules are the
      # boundary for the one move that turns injected text into a program run with this job's
      # tokens: writing git's config, which names programs a later git call runs. `git config`
      # and `git -c` set it directly, and `--output`, which `git diff`, `git log` and `git show`
      # take, writes anywhere. Deny outranks auto mode's review, quoted or escaped spellings too.
      # A label this run adds starts the workflow it triggers, as the maintainer's own does
      # (review-followup.yml accepts `claude[bot]` as the sender, and says why that is safe). The
      # appended instruction is what makes "make this change, then add `review-followup`" review
      # the change.
      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model opus --effort high --disallowedTools "Bash(git config *),Bash(git -c *),Bash(git *--output*)" --append-system-prompt "When a request asks you both to push a change and to add a label, push first and add the label only once the push has succeeded: a label starts a workflow that reads the head as it is at that moment."'
          additional_permissions: |
            actions: read
